name: Generate verified GTT tram 5000 render

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate tram series 5000 asset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate the reference-aligned render
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const prompt = `Use case: product-mockup
          Asset type: BusRadar vehicle-detail render
          Primary request: Produce a photorealistic, reference-accurate 3D product render of a GTT Torino tram from the 5000 series, specifically the 1989-1992 T.P.R. articulated low-floor type.
          Subject: A 22.2 metre, two-section tram with one central articulation, three bogies and four passenger doors. Use the verified real 5014-style front characteristics: rounded silver-grey cab, wide slanted split windscreen with two wipers, rectangular headlamps low in the blue front band, black lower bumper/skirt, roof ventilation grilles above the windscreen, roof pantograph, and tall side windows. The body must have the real grey/silver GTT livery: deep cobalt-blue lower panels, thin orange waist stripe and GTT marks. Preserve the asymmetric front shape and technical roof equipment of this tram; it is not a bus and not a modern five-section tram.
          Scene/backdrop: dark neutral studio with a subtle glossy floor reflection, no rails required.
          Style/medium: high-fidelity photorealistic transport product render.
          Composition/framing: three-quarter front-left view, full vehicle visible with generous padding, matching the existing BusRadar vehicle-card composition.
          Lighting/mood: clean soft studio lighting that reveals the cab shape, articulation and bogies.
          Text: no route number, no advertising, no fleet number, no decals with readable text.
          Constraints: two sections only; exactly one articulation; exactly three bogies; exactly four passenger doors; grey/silver, blue and orange livery; pantograph and roof grilles visible.
          Avoid: white-and-yellow livery, a boxy flat-front tram, a bus, a five-section tram, invented logos, passengers, streetscape, watermark, unreadable text.`;

          const response = await fetch('https://api.openai.com/v1/images/generations', {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.OPENAI_API_KEY}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              model: 'gpt-image-2',
              prompt,
              size: '1536x1024',
              quality: 'high',
              background: 'opaque',
              output_format: 'png',
              n: 1,
            }),
          });

          if (!response.ok) {
            throw new Error(`OpenAI image generation failed (${response.status}): ${await response.text()}`);
          }

          const payload = await response.json();
          const image = payload?.data?.[0]?.b64_json;
          if (!image) throw new Error('OpenAI image generation returned no PNG payload.');
          fs.writeFileSync('frontend/public/assets/vehicles/detail/generated/tram-serie-5000-gtt-render-v4.png', Buffer.from(image, 'base64'));
          NODE

      - name: Verify generated PNG
        run: file frontend/public/assets/vehicles/detail/generated/tram-serie-5000-gtt-render-v4.png

      - name: Update the app references
        run: |
          sed -i 's/tram-serie-5000-gtt-render-v3\.png/tram-serie-5000-gtt-render-v4.png/g' frontend/src/data/gttFleetCatalog.ts frontend/src/data/vehicleFleet.ts

      - name: Create a pull request with the generated asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="codex/tram-serie-5000-render-${{ github.run_id }}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/assets/vehicles/detail/generated/tram-serie-5000-gtt-render-v4.png frontend/src/data/gttFleetCatalog.ts frontend/src/data/vehicleFleet.ts
          git commit -m 'Add reference-aligned GTT tram 5000 render'
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title 'Add reference-aligned GTT tram 5000 render' --body 'Generated with the repository OpenAI Actions secret from the verified GTT 5014 visual constraints. Review the visual against the reference photo before merge.'
