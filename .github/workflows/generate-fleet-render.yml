name: Generate a GTT fleet render

# One workflow for every cluster in the fleet catalog. The prompt is not written
# here: it is read from `frontend/src/data/gttFleetCatalog.ts`, so a render made
# through this workflow shares the framing, scale and studio setup of the
# existing ones instead of drifting from a copy of the prompt in YAML.
#
# The result is never merged automatically. It arrives as a pull request to be
# checked against the sources recorded on the cluster, because AGENTS.md forbids
# assigning a fleet render without verifying model, series and livery.

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Fleet cluster key, for example tram-serie-8000 or iveco-citelis-12m'
        required: true
        type: string
      promote:
        description: 'Point the catalog at the new file and mark it validated-render'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate render
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Show the prompt this cluster will use
        working-directory: frontend
        run: node scripts/fleet-render.mjs --cluster '${{ inputs.cluster }}' --dry-run

      - name: Generate the render
        working-directory: frontend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/fleet-render.mjs --cluster '${{ inputs.cluster }}'

      - name: Point the catalog at the new file
        if: ${{ inputs.promote }}
        working-directory: frontend
        run: node scripts/fleet-render-promote.mjs --cluster '${{ inputs.cluster }}'

      - name: Verify the app still builds
        working-directory: frontend
        run: |
          npm run verify:assets
          npm run build

      - name: Open a pull request with the render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cluster='${{ inputs.cluster }}'
          branch="claude/render-${cluster}-${{ github.run_id }}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/assets/vehicles/detail/generated frontend/src/data/gttFleetCatalog.ts
          git commit -m "Add a generated render for ${cluster}"
          git push --set-upstream origin "$branch"
          {
            printf 'Render generato dal workflow `generate-fleet-render` per il cluster `%s`.\n\n' "$cluster"
            printf 'Il prompt viene da `renderPrompt` in `frontend/src/data/gttFleetCatalog.ts`, quindi condivide inquadratura, scala e set con i render gia approvati.\n\n'
            printf '**Da controllare prima del merge**, come richiede `AGENTS.md`: modello, serie e livrea vanno confrontati con le fonti indicate nel campo `sourceNotes` del cluster. Se il render non corrisponde, chiudere la pull request e rigenerare dopo aver corretto il prompt nel catalogo, non ritoccando il file.\n\n'
            printf -- '---\n'
            printf '_Generated by [Claude Code](https://claude.ai/code)_\n'
          } > /tmp/render-pr-body.md
          gh pr create --base main --head "$branch" \
            --title "Add a generated render for ${cluster}" \
            --body-file /tmp/render-pr-body.md
