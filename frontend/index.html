<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070A" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232f7dff'/><circle cx='32' cy='32' r='18' fill='none' stroke='white' stroke-width='5'/><circle cx='32' cy='32' r='5' fill='white'/><path d='M32 5v9M32 50v9M5 32h9M50 32h9' stroke='white' stroke-width='5' stroke-linecap='round'/></svg>" />
    <title>BusRadar v0.2.1</title>
    <style>
      #boot-status {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-content: center;
        gap: 14px;
        padding: 32px;
        background: #05070a;
        color: #fff;
        font: 600 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      #boot-status button {
        min-height: 46px;
        border: 0;
        border-radius: 12px;
        background: #2f7dff;
        color: #fff;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div id="boot-status">
      <span>Caricamento BusRadar...</span>
      <button type="button" hidden onclick="location.replace(location.pathname + '?reload=' + Date.now())">Ricarica applicazione</button>
    </div>
    <div id="root"></div>
    <script>
      window.setTimeout(function () {
        var status = document.getElementById('boot-status');
        if (!status) return;
        status.querySelector('span').textContent = 'BusRadar non si è caricato correttamente.';
        status.querySelector('button').hidden = false;
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
